org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
# 打包工具会跟着系统走代理；国内镜像直连快得多，让镜像域名绕开代理。
systemProp.http.nonProxyHosts=*.aliyun.com|*.aliyuncs.com|mirrors.cloud.tencent.com|localhost|127.0.0.1
systemProp.https.nonProxyHosts=*.aliyun.com|*.aliyuncs.com|mirrors.cloud.tencent.com|localhost|127.0.0.1
# 应用名（桌面图标下的名字），也可以命令行 -PappName="我的壳" 覆盖
appName=AI Phone Peek
