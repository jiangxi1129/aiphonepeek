name: build-release-apk

# 推一个 v* 标签（例如 git tag v1.0.0 && git push origin v1.0.0）就会打 release APK 并挂到 GitHub Release。
# 签名：在仓库 Settings → Secrets and variables → Actions 里配下面四个 secret，就用你自己的 keystore 签名；
#   KEYSTORE_BASE64    keystore 文件的 base64（macOS/Linux:  base64 -i release.jks | pbcopy）
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
# 没配的话自动用 debug 签名出包（能装能用，但文件名带 -debugsigned，并且之后换成正式签名时需要卸载重装）。
# 钥匙只在 CI 运行时解码到临时目录，不会进仓库、不会进产物。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app_name:
        description: "桌面上显示的 App 名字（留空用 android/gradle.properties 里的 appName）"
        required: false
        default: ""
      icon_url:
        description: "图标图片的网址（PNG/JPG，方的最好；留空就用仓库里的 android/custom-icon.png，没有就用默认图标）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode keystore (if provided)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没配 KEYSTORE_BASE64，使用 debug 签名出包"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Custom icon (optional)
        env:
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          SRC=""
          if [ -n "$ICON_URL" ]; then
            curl -fsSL --max-filesize 5000000 "$ICON_URL" -o "$RUNNER_TEMP/icon-src"
            SRC="$RUNNER_TEMP/icon-src"
          elif [ -f android/custom-icon.png ]; then
            SRC="android/custom-icon.png"
          fi
          if [ -z "$SRC" ]; then echo "用默认图标"; exit 0; fi
          IM=$(command -v magick || command -v convert || true)
          if [ -z "$IM" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; IM=$(command -v magick || command -v convert); fi
          "$IM" identify "$SRC" >/dev/null 2>&1 || identify "$SRC" >/dev/null || { echo "::error::图标不是能识别的图片"; exit 1; }
          RES=android/app/src/main/res
          # 自定义图标：去掉默认的自适应图标，换成各种分辨率的 PNG（居中裁成正方形）
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n="${d%%:*}"; s="${d##*:}"
            mkdir -p "$RES/mipmap-$n"
            "$IM" "$SRC" -resize "${s}x${s}^" -gravity center -extent "${s}x${s}" "$RES/mipmap-$n/ic_launcher.png"
          done
          echo "图标已换成：$SRC"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0-dev"
          EXTRA=()
          if [ -n "$APP_NAME" ]; then EXTRA+=("-PappName=$APP_NAME"); fi
          gradle assembleRelease -PuseMirror=false -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER" "${EXTRA[@]}"

      - name: Rename artifact
        run: |
          NAME="aiphonepeek-${GITHUB_REF_NAME}"
          [ "${{ steps.ks.outputs.signed }}" = "true" ] || NAME="${NAME}-debugsigned"
          mv android/app/build/outputs/apk/release/app-release.apk "${NAME}.apk"
          echo "APK_FILE=${NAME}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          body: |
            ${{ steps.ks.outputs.signed == 'true' && '已用仓库 secrets 里的 keystore 签名。' || '⚠️ 这个包是 debug 签名（仓库没配 keystore secrets）。能安装使用；以后换正式签名需先卸载再装。' }}
