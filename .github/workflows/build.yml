name: build-release-apk

# 推一个 v* 标签（例如 git tag v1.0.0 && git push origin v1.0.0）就会打 release APK 并挂到 GitHub Release。
# 签名：在仓库 Settings → Secrets and variables → Actions 里配下面四个 secret，就用你自己的 keystore 签名；
#   KEYSTORE_BASE64    keystore 文件的 base64（macOS/Linux:  base64 -i release.jks | pbcopy）
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
# 没配的话自动用 debug 签名出包（能装能用，但文件名带 -debugsigned，并且之后换成正式签名时需要卸载重装）。
# 钥匙只在 CI 运行时解码到临时目录，不会进仓库、不会进产物。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode keystore (if provided)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没配 KEYSTORE_BASE64，使用 debug 签名出包"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0-dev"
          gradle assembleRelease -PuseMirror=false -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Rename artifact
        run: |
          NAME="aiphonepeek-${GITHUB_REF_NAME}"
          [ "${{ steps.ks.outputs.signed }}" = "true" ] || NAME="${NAME}-debugsigned"
          mv android/app/build/outputs/apk/release/app-release.apk "${NAME}.apk"
          echo "APK_FILE=${NAME}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          body: |
            ${{ steps.ks.outputs.signed == 'true' && '已用仓库 secrets 里的 keystore 签名。' || '⚠️ 这个包是 debug 签名（仓库没配 keystore secrets）。能安装使用；以后换正式签名需先卸载再装。' }}
